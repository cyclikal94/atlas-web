# STUB backend for CHECKS ONLY (scripts/smoke-image.sh). The backend half of the composed origin the image smoke's browser suite runs
# at: the reference proxy (deploy/nginx/proxy.conf.template) sends the backend's paths here and everything else to the image under
# test. It answers /health and /ready the way the released backend does, as scripts/preview-with-stub-backend.mjs does for Playwright's
# own production server, and refuses every other path with a 404, so a request the suite does not expect fails visibly instead of
# receiving a success. A pass against it is fixture evidence: it says nothing about a real backend, and it is never packaged.
log_format atlas_smoke_backend '$request_method $request_uri $status "$http_user_agent"';

server {
  listen 3000 default_server;
  server_name _;
  default_type application/json;
  access_log /var/log/nginx/access.log atlas_smoke_backend;
  add_header X-Atlas-Check-Backend "stub" always;

  location = /health {
    # The released backend's shape (alphabetical keys); the client reads `api_version` (decision D-08).
    return 200 '{"api_version":"0.31.0","status":"ok"}';
  }
  location = /ready {
    return 200 '{"status":"ready"}';
  }
  location / {
    return 404 '{}';
  }
}

# STUB backend for CHECKS ONLY (deploy/compose.fixture.yaml, scripts/smoke-compose.sh --stub). It answers every request with what it
# received, so routing, path preservation, Host, cookie and header pass-through can be tested without a real backend. A pass
# against this stub is fixture evidence: it says nothing about the real backend, and it is never packaged.
server {
  listen 3000 default_server;
  server_name _;
  default_type application/json;
  add_header X-Stub-Backend "true" always;

  location = /health {
    return 200 '{"status":"ok"}';
  }
  location = /ready {
    return 200 '{"status":"ready"}';
  }
  location / {
    add_header X-Stub-Backend "true" always;
    add_header Set-Cookie "atlas_session=stub-value; Path=/; HttpOnly; SameSite=Lax" always;
    return 200 '{"host":"$http_host","uri":"$request_uri","origin":"$http_origin","csrf":"$http_x_csrf_token","cookie":"$http_cookie","xfp":"$http_x_forwarded_proto","xfh":"$http_x_forwarded_host"}';
  }
}

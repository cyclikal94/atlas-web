# Atlas web + backend behind ONE public origin, for evaluation and small deployments (Q5, Q6).
#
# Four services: the reference reverse proxy (the only published port), the frontend, the backend, and the PostgreSQL
# database the released backend container image requires (it refuses SQLite in containers). Browser pages and assets go to the
# frontend; the backend's paths (/api, /health, /ready, /auth, /oidc) go to the backend. The public origin is the
# proxy's. ATLAS_PUBLIC_ORIGIN MUST equal it exactly, or browser sign-in and CSRF checks fail.
#
# This file listens on loopback HTTP only. For anything reachable from a network, terminate TLS in front of the proxy (the
# session cookie is __Host-atlas_session over HTTPS) and set ATLAS_PUBLIC_ORIGIN to the https:// origin.
#
#   cp deploy/.env.example deploy/.env      # then edit it (never commit the copy)
#   docker compose --env-file deploy/.env -f deploy/compose.yaml up -d
#   docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm -T --no-deps backend account alice   # password on stdin
#
# No secrets live in this file. Images are named explicitly: there are no guessed defaults for them. The backend's own
# documentation (its docs/operations.md) is the authority on running it: backups, upgrades and rolling updates included.
name: atlas-web-example

services:
  proxy:
    image: ${ATLAS_PROXY_IMAGE:?set ATLAS_PROXY_IMAGE (an nginx-unprivileged image, see .env.example)}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${ATLAS_LISTEN_ADDRESS:-127.0.0.1}:${ATLAS_PROXY_PORT:-8090}:8080"
    environment:
      ATLAS_WEB_UPSTREAM: web:8080
      ATLAS_BACKEND_UPSTREAM: backend:3000
      ATLAS_PROXY_MAX_BODY: ${ATLAS_PROXY_MAX_BODY:-8m}
    volumes:
      - ./nginx/proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    # The image renders the template into /etc/nginx/conf.d at start, so that directory is a writable tmpfs owned by the
    # unprivileged user (UID 101); everything else stays read-only.
    tmpfs:
      - /tmp:mode=1777
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
    depends_on:
      web:
        condition: service_started
      backend:
        condition: service_started

  web:
    image: ${ATLAS_WEB_IMAGE:?set ATLAS_WEB_IMAGE to the atlas-web image you built or pulled}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777

  backend:
    image: ${ATLAS_BACKEND_IMAGE:?set ATLAS_BACKEND_IMAGE to the Atlas backend image (a tag or digest you have verified)}
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      ATLAS_BIND: 0.0.0.0:3000
      ATLAS_PUBLIC_ORIGIN: ${ATLAS_PUBLIC_ORIGIN:?set ATLAS_PUBLIC_ORIGIN to the exact public origin, for example http://localhost:8090}
      # The password must be URL-safe (letters, digits, - _ . ~): it is embedded in this URL.
      ATLAS_DATABASE_URL: postgres://atlas:${ATLAS_POSTGRES_PASSWORD:?set ATLAS_POSTGRES_PASSWORD (a long random URL-safe value)}@postgres:5432/atlas
      ATLAS_TRUSTED_PROXY_IPS: ${ATLAS_TRUSTED_PROXY_IPS:-}
    env_file:
      - path: ./atlas.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ${ATLAS_POSTGRES_IMAGE:?set ATLAS_POSTGRES_IMAGE (a PostgreSQL image pinned by digest, see .env.example)}
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_DB: atlas
      POSTGRES_PASSWORD: ${ATLAS_POSTGRES_PASSWORD:?set ATLAS_POSTGRES_PASSWORD (a long random URL-safe value)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U atlas -d atlas]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s

volumes:
  postgres-data:

# Compose override for CHECKS ONLY (scripts/smoke-compose.sh --stub). It swaps the backend for a stub that echoes what the
# proxy forwards (deploy/stub-backend.conf), so routing, Host and cookie pass-through can be tested without a backend or a
# database. A pass here is fixture evidence, not integration evidence: it says nothing about the real backend. Never packaged.
services:
  backend:
    image: ${ATLAS_PROXY_IMAGE:?set ATLAS_PROXY_IMAGE}
    user: "101:101"
    depends_on: !reset {}
    volumes:
      - ./stub-backend.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /tmp:mode=1777
  postgres:
    profiles: ["disabled-in-fixture"]

# Atlas web: the static frontend container (unprivileged, port 8080). It serves only the built client. It is one half of a
# same-origin pair: a reverse proxy or Ingress sends browser pages and assets here and the backend's paths to the backend
# (docs/hosting.md). This file has no variables, so the image runs with a read-only root filesystem.
server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;

  root /srv/atlas-web;
  index index.html;

  server_tokens off;
  charset utf-8;
  absolute_redirect off;
  port_in_redirect off;

  # Compress text assets. The built files hold no secrets and no per-user data, so compression cannot leak anything (BREACH needs a
  # secret reflected beside attacker-controlled text). woff2 is already compressed and is left alone.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Only GET and HEAD: this container serves files and nothing else.
  if ($request_method !~ ^(?:GET|HEAD)$) {
    return 405;
  }
  error_page 405 = @method_not_allowed;
  location @method_not_allowed {
    include /etc/nginx/snippets/atlas-security-headers.conf;
    add_header Allow "GET, HEAD" always;
    add_header Cache-Control "no-store" always;
    return 405;
  }

  # Backend paths must never receive the app shell: a mis-routed API call fails visibly instead of receiving HTML.
  # The prefix list is the one in src/lib/backend-routes.ts; scripts/check-route-parity.mjs keeps them identical.
  location ~ ^/(?:api|health|ready|auth|oidc)(?:/|$) {
    include /etc/nginx/snippets/atlas-security-headers.conf;
    add_header Cache-Control "no-store" always;
    default_type text/plain;
    return 404 "This path belongs to the Atlas backend. Route it to the backend at the reverse proxy or Ingress.\n";
  }

  # The frontend's own probe and provenance. /_web/* is reserved for the frontend, so /health stays the backend's.
  location = /_web/health {
    access_log off;
    include /etc/nginx/snippets/atlas-security-headers.conf;
    add_header Cache-Control "no-store" always;
    default_type text/plain;
    return 200 "ok\n";
  }
  location ^~ /_web/ {
    include /etc/nginx/snippets/atlas-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Hashed build output is immutable. A missing asset is a 404, never the shell.
  location ^~ /assets/ {
    include /etc/nginx/snippets/atlas-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # No dotfiles.
  location ~ /\. {
    return 404;
  }

  # Unhashed entry points: always revalidate, so an update is seen promptly.
  location ~ ^/(?:index\.html|sw\.js|theme-init\.js|noscript\.css|favicon\.svg)$ {
    include /etc/nginx/snippets/atlas-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Any other path with a file extension is a file request: 404 when absent, never the shell.
  # Client routes therefore contain no dot.
  location ~ "\.[A-Za-z0-9]{1,8}$" {
    include /etc/nginx/snippets/atlas-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Everything else is a client route: serve the shell so deep links and reloads work.
  location / {
    include /etc/nginx/snippets/atlas-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
